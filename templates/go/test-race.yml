include:
  - local: "/templates/defaults.yml"

test-race:
  stage: test
  needs: []
  rules: !reference [.default-rules, rules]
  image: golang:1.26-alpine
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - .go-cache/
  variables:
    DEFAULT_WORKSPACE: $CI_PROJECT_DIR
    CGO_ENABLED: "1"
    TEST_PATH: "./..."
    TEST_ARG: ""
    RACE_REPORT: "race-report.xml"
  allow_failure: true
  before_script:
    - export GOCACHE=${CI_PROJECT_DIR}/.go-cache
    - apk add --no-cache git gcc musl-dev
    - cd ${CI_PROJECT_DIR}
    - go mod download
  script:
    - |
      if go tool gotestsum --version >/dev/null 2>&1; then
        GOTESTSUM="go tool gotestsum"
      else
        go install gotest.tools/gotestsum@v1.13.0
        GOTESTSUM="gotestsum"
      fi
      $GOTESTSUM --format standard-verbose --junitfile ${RACE_REPORT} -- -race -count=1 ${TEST_ARG} ${TEST_PATH}
  artifacts:
    when: always
    reports:
      junit: ${RACE_REPORT}
